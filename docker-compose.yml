services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: malina
      POSTGRES_PASSWORD: malina_dev_password
      POSTGRES_DB: malina
    ports: ["5432:5432"]
    volumes: ["malina_pgdata:/var/lib/postgresql/data"]
volumes:
  malina_pgdata:
